<svg xmlns="http://www.w3.org/2000/svg" class="kitsu-character" viewBox="-12 -8 90 94" fill="none" aria-hidden="true" data-kitsu-character>
<title>Kitsu, la volpe viaggiatrice</title>
<style>
.kitsu-character{overflow:visible}
.kitsu-tail,.kitsu-head,.kitsu-arm-wave,.kitsu-arm-left,.kitsu-step-left,.kitsu-step-right,.kitsu-scarf{transform-box:fill-box}.kitsu-tail{transform-origin:10% 55%}.kitsu-head{transform-origin:50% 100%}.kitsu-arm-wave{transform-origin:25% 20%}.kitsu-arm-left{transform-origin:75% 20%}.kitsu-step-left{transform-origin:75% 0%}.kitsu-step-right{transform-origin:25% 0%}.kitsu-eyes{transform-box:fill-box;transform-origin:center}.kitsu-scarf{transform-origin:30% 0%}
@media(prefers-reduced-motion:no-preference){
 .kitsu-tail{animation:kitsu-wag 3.8s ease-in-out infinite}
 .kitsu-head{animation:kitsu-curious 8s ease-in-out infinite}
 .kitsu-eyes{animation:kitsu-blink 7.2s linear infinite}
 .kitsu-arm-wave{animation:kitsu-hello 10s ease-in-out infinite}
 .kitsu-arm-left{animation:kitsu-arm-rest 5s ease-in-out infinite}
 .kitsu-step-left{animation:kitsu-step 9s ease-in-out infinite}
 .kitsu-step-right{animation:kitsu-step 9s ease-in-out -.25s infinite}
 .kitsu-scarf{animation:kitsu-breeze 4s ease-in-out infinite}
 .kitsu-character[data-kitsu-action="hello"] .kitsu-arm-wave{animation:kitsu-greeting .9s ease-in-out 2}
 .kitsu-character[data-kitsu-action="hello"] .kitsu-head{animation:kitsu-nod .9s ease-in-out 2}
 .kitsu-character[data-kitsu-action="hello"] .kitsu-tail{animation:kitsu-wag .45s ease-in-out 4}
 .kitsu-character[data-kitsu-action="hello"] .kitsu-step-left{animation:kitsu-step .9s ease-in-out 2}
}
@keyframes kitsu-wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(14deg)}}
@keyframes kitsu-curious{0%,34%,66%,100%{transform:rotate(0)}42%,55%{transform:rotate(-6deg)}75%,83%{transform:rotate(4deg)}}
@keyframes kitsu-blink{0%,38%,42%,77%,81%,100%{transform:scaleY(1)}40%,79%{transform:scaleY(.08)}}
@keyframes kitsu-hello{0%,62%,95%,100%{transform:rotate(0)}70%,80%,90%{transform:rotate(-115deg)}75%,85%{transform:rotate(-145deg)}}
@keyframes kitsu-arm-rest{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes kitsu-step{0%,68%,86%,100%{transform:rotate(0)}74%,80%{transform:rotate(14deg)}77%,83%{transform:rotate(-8deg)}}
@keyframes kitsu-breeze{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
@keyframes kitsu-greeting{0%,100%{transform:rotate(-100deg)}25%,75%{transform:rotate(-155deg)}50%{transform:rotate(-110deg)}}
@keyframes kitsu-nod{0%,100%{transform:rotate(0)}35%{transform:rotate(-8deg)}70%{transform:rotate(5deg)}}
</style>
<ellipse cx="32" cy="76" rx="15" ry="2.5" fill="#74877e" opacity=".16"/>
<g class="kitsu-tail"><path d="M43 44c17-1 22 17 11 25-7 5-16 2-17-5Z" fill="#d98c46"/><path d="M59 54c5 8-1 15-8 17l-5-9Z" fill="#fff7e8"/></g>
<rect x="38" y="42" width="13" height="22" rx="5" fill="#bc9654" stroke="#8e6c36" stroke-width="1.5"/>
<g class="kitsu-step-left"><path d="M23 61h9l-4 12h-9Z" fill="#314a51"/><path d="M20 70h8v4h-9Z" fill="#22373b"/></g>
<g class="kitsu-step-right"><path d="M33 61h9l3 12h-9Z" fill="#314a51"/><path d="M36 70h8l2 4H36Z" fill="#22373b"/></g>
<path d="M18 50c0-12 28-12 28 0v14c-8 5-20 5-28 0Z" fill="#e6bc7b"/>
<path d="M25 54c4-4 10-4 14 0v10H25Z" fill="#fff0d5"/>
<g class="kitsu-arm-left"><path d="m19 50-7 11" stroke="#d98c46" stroke-width="7" stroke-linecap="round"/><circle cx="12" cy="61" r="3.5" fill="#fff0d5"/></g>
<g class="kitsu-arm-wave"><path d="m44 50 7 10" stroke="#d98c46" stroke-width="7" stroke-linecap="round"/><circle cx="51" cy="60" r="3.5" fill="#fff0d5"/></g>
<g class="kitsu-head">
 <path d="M14 24 12 7l16 10m9 0L53 7l-3 20" fill="#d98c46" stroke="#ac693c" stroke-width="1.5" stroke-linejoin="round"/>
 <path d="m16 14 2 10 8-5m22-5-2 10-8-5" fill="#fff2df"/>
 <path d="M10 29c0-24 44-24 44 0 0 17-11 21-22 21S10 46 10 29" fill="#df9855"/>
 <path d="M12 30c5-4 13 7 20 8 7-1 15-12 20-8 0 11-9 19-20 19s-20-8-20-19" fill="#fff7e8"/>
 <g class="kitsu-eyes"><circle cx="23" cy="29" r="2.5" fill="#253d43"/><circle cx="41" cy="29" r="2.5" fill="#253d43"/><circle cx="23.7" cy="28.2" r=".7" fill="#fff"/><circle cx="41.7" cy="28.2" r=".7" fill="#fff"/></g>
 <ellipse cx="17.5" cy="35" rx="3" ry="1.5" fill="#edb599"/><ellipse cx="46.5" cy="35" rx="3" ry="1.5" fill="#edb599"/>
 <path d="m28 36 4 4 4-4Z" fill="#253d43"/><path d="M28 42q4 4 8 0" stroke="#253d43" stroke-width="1.8" stroke-linecap="round"/>
 <path d="M8 23q24-12 48 0l-4 5q-20-6-40 0Z" fill="#65846e"/><path d="M19 19q13-15 26 0" fill="#7a9477"/><path d="M19 20h26" stroke="#e3c689" stroke-width="3"/>
</g>
<path d="M16 47q16 6 32 0l-2 7q-14 5-28 0Z" fill="#b84339"/>
<path class="kitsu-scarf" d="m37 51 6 14-8-1-3-12" fill="#d76553"/>
</svg>